<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-talking — Live2D</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Live2D Cubism core runtime (official latest, supports all moc3 versions).
       Falls back to your local copy in web/live2d/ if offline. -->
  <script crossorigin="anonymous" src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

  <!-- PixiJS v7 + pixi-live2d-display-lipsyncpatch (Cubism 4 build) from CDN.
       This fork supports modern VTube Studio models and has built-in lip-sync.
       Needs internet on first load; cached by the browser afterwards. -->
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/pixi-live2d-display-lipsyncpatch@0.5.0-ls-8/dist/cubism4.min.js"></script>
</head>
<body>
  <!-- Start overlay: a user gesture is required to enable audio playback. -->
  <div id="overlay">
    <div class="overlay-inner">
      <h1>AI-talking</h1>
      <p id="overlay-status">はじめるボタンを押してね</p>
      <button id="start-btn" disabled>読み込み中...</button>
      <p class="hint">※ VOICEVOX を起動しておいてください</p>
    </div>
  </div>

  <canvas id="live2d-canvas"></canvas>

  <!-- HUD: state badge + latest transcript -->
  <div id="hud">
    <div id="state-badge" class="state-idle">待機中</div>
    <div id="subtitles">
      <div id="user-line"></div>
      <div id="assistant-line"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
