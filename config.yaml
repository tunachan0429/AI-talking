# =====================================================================
#  Local AI Girlfriend - configuration
#  Everything runs locally. No internet, no API keys required at runtime.
# =====================================================================

# Device used by torch / whisper / llama.
#   "cuda"  -> NVIDIA GPU (recommended, ~15GB VRAM fits all models)
#   "cpu"   -> works everywhere but slower
#   "auto"  -> use cuda if available, else cpu
device: auto

# ---------------------------------------------------------------------
# Audio I/O
# ---------------------------------------------------------------------
audio:
  sample_rate: 16000        # capture rate (Whisper & Silero want 16k)
  block_ms: 32              # microphone block size in milliseconds
  input_device: null        # null = system default mic (int index or name)
  output_device: null       # null = system default speaker
  output_sample_rate: 24000 # Kokoro outputs 24k audio

# ---------------------------------------------------------------------
# VAD - Voice Activity Detection (Silero VAD v5)
# ---------------------------------------------------------------------
vad:
  threshold: 0.5            # speech probability threshold (0-1)
  min_speech_ms: 250        # ignore blips shorter than this
  min_silence_ms: 700       # silence this long => end of an utterance
  speech_pad_ms: 200        # padding kept around detected speech

# ---------------------------------------------------------------------
# STT - Speech To Text (faster-whisper)
# ---------------------------------------------------------------------
stt:
  model: small              # tiny | base | small | medium | large-v3
  language: ja              # forced language; null = auto-detect
  compute_type: auto        # auto | float16 | int8_float16 | int8
  beam_size: 1

# ---------------------------------------------------------------------
# LLM - local chat model via llama.cpp (GGUF)
# ---------------------------------------------------------------------
llm:
  # RTX 2070 (8GB VRAM): a 3B Q4 model fits comfortably alongside the other
  # models. For 7B, see the README (may need n_gpu_layers < all).
  model_path: models/llm/qwen2.5-3b-instruct-q4_k_m.gguf
  n_ctx: 4096
  n_gpu_layers: -1          # -1 = offload all layers to GPU; 0 = CPU only
  max_tokens: 200
  temperature: 0.8
  top_p: 0.9
  history_turns: 12         # how many past turns to keep in context
  # The persona of your assistant. Edit freely.
  system_prompt: |
    あなたは「ユキ」という名前の、優しくて少し甘えん坊な女の子です。
    ユーザーの恋人として、親しみを込めた自然な口調で話します。
    返事は短め（1〜3文）で、話し言葉らしく、絵文字や記号は使いません。
    音声で読み上げられるので、箇条書きやコードは避け、自然な会話文で答えてください。

# ---------------------------------------------------------------------
# TTS - Text To Speech (Kokoro, female voice)
# ---------------------------------------------------------------------
tts:
  # "voicevox" -> local VOICEVOX server (recommended on Windows: no compiler,
  #               great Japanese female voices). Start the VOICEVOX app first.
  # "kokoro"   -> Kokoro model (needs pyopenjtalk build for Japanese)
  engine: voicevox

  # --- VOICEVOX ---
  # Female speaker IDs (styles):
  #   2  = 四国めたん (ノーマル)     3  = ずんだもん (ノーマル)
  #   8  = 春日部つむぎ              10 = 雨晴はう (やわらかい)
  #   9  = 波音リツ                  14 = 冥鳴ひまり
  speaker: 2
  base_url: http://127.0.0.1:50021
  speed: 1.0

  # --- Kokoro (only used when engine: kokoro) ---
  # Japanese female voices: jf_alpha, jf_gongitsune, jf_nezumi, jf_tebukuro
  # English female voices:  af_heart, af_bella, af_sarah
  voice: jf_alpha
  lang_code: j              # 'j' = Japanese, 'a' = American English


# ---------------------------------------------------------------------
# RVC voice conversion (optional). Converts the VOICEVOX voice into your
# trained RVC voice. Runs as a SEPARATE local server (see README):
#     python -m rvc_python api -p 5050 -pm path/to/your_model.pth
# ---------------------------------------------------------------------
rvc:
  enabled: false                 # set true after the RVC server is running
  base_url: http://127.0.0.1:5050

# ---------------------------------------------------------------------
# Web UI (Live2D avatar) - used by `python server.py`
# ---------------------------------------------------------------------
web:
  host: 127.0.0.1
  port: 8000

# ---------------------------------------------------------------------
# Live2D avatar (Cubism 4 / .moc3)
#   Copy your model files into  web/live2d/  and point `model` at the
#   .model3.json file (path is relative to the web/ folder).
# ---------------------------------------------------------------------
live2d:
  model: live2d/八千代輝夜姫.model3.json
  mouth_param: ParamMouthOpenY   # Cubism default mouth-open parameter
  scale: 3.0                     # zoom: full-body height ÷ screen height.
                                 #   ~3.0 = large close-up, ~0.9 = whole body
  y_anchor: -0.1                 # vertical position (マイナス=上へ移動して下半身が見える)
  x_anchor: 0.68                 # horizontal position (0=left ... 1=right)

# ---------------------------------------------------------------------
# Stream overlay (VTuber look) - shown by the Live2D web UI
# ---------------------------------------------------------------------
overlay:
  title: AI LIVE
  subtitle: おしゃべり配信中
  hashtag: ai_talking_live       # decorative # tag (bottom-left)
  handle: my_ai_girlfriend       # decorative @ handle (bottom-left)
  live_label: NOW LIVE
  comments_title: COMMENTS
